# Fly.io deploy:  fly launch --no-deploy --copy-config && fly secrets set OPENWEBNINJA_API_KEY=... && fly deploy
# Run from the repo root so the Docker build can see src/jobs.
app = "job-hunt-search"
primary_region = "dfw"

[build]
  dockerfile = "server/Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpus = 1
